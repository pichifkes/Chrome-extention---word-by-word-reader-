<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SwiftRead Enhanced</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <h1>Swift<span>Read</span> Enhanced</h1>

  <button id="btn-read-page">▶ Read This Page</button>

  <hr class="divider">

  <p class="section-title">Speed</p>

  <div class="setting">
    <div class="setting-row">
      <label for="input-wpm">Reading speed</label>
      <span class="setting-val" id="val-wpm">250 WPM</span>
    </div>
    <input type="range" id="input-wpm" min="50" max="800" step="10" value="250">
  </div>

  <hr class="divider">

  <p class="section-title">Pacing modifiers</p>

  <div class="setting">
    <div class="setting-row">
      <label for="input-cpp">Long-word penalty</label>
      <span class="setting-val" id="val-cpp">10% / char</span>
    </div>
    <input type="range" id="input-cpp" min="0" max="0.5" step="0.05" value="0.1">
  </div>

  <div class="setting">
    <div class="setting-row">
      <label for="input-hm">Hyphen slow-down</label>
      <span class="setting-val" id="val-hm">1.8×</span>
    </div>
    <input type="range" id="input-hm" min="1.0" max="4.0" step="0.1" value="1.8">
  </div>

  <hr class="divider">

  <button id="btn-reset">Reset to defaults</button>

  <hr class="divider">

  <p class="section-title">Keyboard shortcuts</p>

  <div class="hint">
    <div class="hint-row"><span>Play / Pause</span>    <kbd>Space</kbd></div>
    <div class="hint-row"><span>Back one word</span>   <kbd>←</kbd></div>
    <div class="hint-row"><span>Forward one word</span><kbd>→</kbd></div>
    <div class="hint-row"><span>Slower (−10 WPM)</span><kbd>↓</kbd></div>
    <div class="hint-row"><span>Faster (+10 WPM)</span><kbd>↑</kbd></div>
    <div class="hint-row"><span>Close reader</span>    <kbd>Esc</kbd></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
